name: Build LumaVault APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-detect & unpack ZIP archive
        id: unpack
        run: |
          mkdir -p build_workspace
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found archive: $ZIP_FILE — unpacking automatically..."
            unzip -oq "$ZIP_FILE" -d build_workspace
            if [ ! -f build_workspace/settings.gradle.kts ]; then
              SUBDIR=$(find build_workspace -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
              echo "project_dir=$SUBDIR" >> $GITHUB_OUTPUT
            else
              echo "project_dir=build_workspace" >> $GITHUB_OUTPUT
            fi
          else
            echo "No ZIP found — building directly from repo root..."
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Fetch rounded Nunito fonts (Latin + Cyrillic)
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: python3 scripts/fetch_fonts.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore for Release APK
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias lumavault \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lumavault123 -keypass lumavault123 \
            -dname "CN=LumaVault, OU=OpenSource, O=LumaVault, L=Local, ST=Local, C=XX"
          echo "KEYSTORE_PATH=$PWD/release-keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=lumavault123" >> $GITHUB_ENV
          echo "KEY_ALIAS=lumavault" >> $GITHUB_ENV
          echo "KEY_PASSWORD=lumavault123" >> $GITHUB_ENV

      - name: Build Release & Debug APKs
        working-directory: ${{ steps.unpack.outputs.project_dir }}
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare APK outputs
        run: |
          mkdir -p apk_output
          cp "${{ steps.unpack.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk" apk_output/LumaVault-release.apk
          cp "${{ steps.unpack.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk" apk_output/LumaVault-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LumaVault-APKs
          path: apk_output/*.apk

